# Load balancer for docker-compose.replicas.yml. Fans a single stable
# entrypoint (host port 3000) out across every client-api replica, using
# Docker's embedded DNS (127.0.0.11) to resolve the service name to
# whichever container IPs currently exist - re-resolved every 10s, so it
# picks up replicas that get restarted (a new container generally gets a
# new IP) without needing to reload nginx itself.
#
# `set $upstream ...` + a variable in proxy_pass (rather than a static
# `upstream {}` block) is what makes that re-resolution happen at all:
# nginx only re-resolves DNS for variables, not for names baked into a
# static upstream block at startup.
resolver 127.0.0.11 valid=10s;

# Standard nginx WebSocket-proxying idiom: forward the client's Upgrade
# header (needed for Socket.IO's websocket transport) but only turn the
# Connection header into "upgrade" when the client actually asked for one -
# hardcoding it would break plain HTTP requests (the SSE endpoint, and the
# rest) sharing this same server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        set $upstream client-api:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE must not be buffered, or messages sit in nginx instead of
        # reaching the client when they're published.
        proxy_buffering off;

        # These are long-lived connections by design - don't let nginx's
        # default 60s idle timeout cut them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
