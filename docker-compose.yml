version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: llc-redis
    ports:
      - "6379:6379"

  client-api:
    build:
      context: ./client-api
    container_name: llc-client-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - DEBUG=socket.io:adapter,socket.io-redis
    volumes:
      - ./client-api:/app
      - /app/node_modules
    depends_on:
      - redis

  worker:
    build:
      context: ./worker
    container_name: llc-worker
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./worker:/app
      - /app/node_modules
    depends_on:
      - redis
